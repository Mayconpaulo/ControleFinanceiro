  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider,
             signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey:            "AIzaSyB3uQPvUIguMTViCdYMVzUEavrou5EDT7U",
      authDomain:        "controle-financeiro-a58e5.firebaseapp.com",
      projectId:         "controle-financeiro-a58e5",
      storageBucket:     "controle-financeiro-a58e5.firebasestorage.app",
      messagingSenderId: "184276496011",
      appId:             "1:184276496011:web:8c67b97c9bfaf8c34cee8e",
      measurementId:     "G-Q280NH5411"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── Helpers ──
    async function saveUserData(uid) {
      try {
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          data[key] = localStorage.getItem(key);
        }
        await setDoc(doc(db, 'users', uid), { data: JSON.stringify(data) });
      } catch (e) { console.warn('Firebase save error:', e); }
    }

    async function loadUserData(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          const saved = JSON.parse(snap.data().data || '{}');
          localStorage.clear();
          for (const [k, v] of Object.entries(saved)) {
            localStorage.setItem(k, v);
          }
        }
      } catch (e) { console.warn('Firebase load error:', e); }
    }

    function patchLocalStorage(uid) {
      const origSet = localStorage.setItem.bind(localStorage);
      let saveTimer;
      localStorage.setItem = function (key, value) {
        origSet(key, value);
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => saveUserData(uid), 800);
      };
    }

    function showApp(user) {
      const overlay = document.getElementById('_fb_overlay');
      const root    = document.getElementById('root');
      const userBar = document.getElementById('_fb_user_bar');
      const label   = document.getElementById('_fb_user_label');
      if (overlay) overlay.style.display = 'none';
      if (root)    root.style.display    = '';
      if (userBar) userBar.style.display = 'block';
      if (label)   label.textContent     = user.displayName || user.email;
    }

    function showLogin() {
      const overlay   = document.getElementById('_fb_overlay');
      const loading   = document.getElementById('_fb_loading');
      const loginForm = document.getElementById('_fb_login');
      const root      = document.getElementById('root');
      const userBar   = document.getElementById('_fb_user_bar');
      if (overlay)   { overlay.style.display   = 'flex'; }
      if (loading)   { loading.style.display   = 'none'; }
      if (loginForm) { loginForm.style.display = ''; }
      if (root)      { root.style.display      = 'none'; }
      if (userBar)   { userBar.style.display   = 'none'; }
    }

    function showLoading() {
      const loading   = document.getElementById('_fb_loading');
      const loginForm = document.getElementById('_fb_login');
      if (loading)   { loading.style.display   = 'flex'; }
      if (loginForm) { loginForm.style.display = 'none'; }
    }

    // ── Auth state ──
    // Strategy: on first login load data from Firestore → reload page.
    // On reload Firebase auto-signs in → data already in localStorage → just show app.
    // Flag in sessionStorage prevents infinite reload loop.
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const alreadyLoaded = sessionStorage.getItem('_fb_loaded');
        if (!alreadyLoaded) {
          // First time after login: fetch cloud data, then reload
          showLoading();
          await loadUserData(user.uid);
          sessionStorage.setItem('_fb_loaded', '1');
          window.location.reload();
        } else {
          // Page was reloaded with data in localStorage: show the app
          patchLocalStorage(user.uid);
          showApp(user);
        }
      } else {
        sessionStorage.removeItem('_fb_loaded');
        showLogin();
      }
    });

    // ── Sign out ──
    window._fbDoSignOut = async () => {
      sessionStorage.removeItem('_fb_loaded');
      await signOut(auth);
    };

    // ── Login handler ──
    window._handleLogin = async (type) => {
      const errorEl = document.getElementById('_fb_error');
      if (errorEl) errorEl.textContent = '';
      try {
        if (type === 'google') {
          await signInWithPopup(auth, new GoogleAuthProvider());
        } else {
          const email = document.getElementById('_fb_email').value.trim();
          const pass  = document.getElementById('_fb_pass').value;
          if (!email || !pass) {
            if (errorEl) errorEl.textContent = 'Preencha o email e a senha.';
            return;
          }
          if (type === 'email-login') {
            await signInWithEmailAndPassword(auth, email, pass);
          } else {
            if (pass.length < 6) {
              if (errorEl) errorEl.textContent = 'Senha deve ter pelo menos 6 caracteres.';
              return;
            }
            await createUserWithEmailAndPassword(auth, email, pass);
          }
        }
      } catch (e) {
        const msgs = {
          'auth/user-not-found':       'Usuário não encontrado.',
          'auth/wrong-password':       'Senha incorreta.',
          'auth/invalid-credential':   'Email ou senha incorretos.',
          'auth/email-already-in-use': 'Este email já está cadastrado.',
          'auth/invalid-email':        'Email inválido.',
          'auth/weak-password':        'Senha muito fraca (mín. 6 caracteres).',
          'auth/popup-closed-by-user': 'Login com Google cancelado.',
          'auth/popup-blocked':        'Popup bloqueado. Permita popups para este site.',
        };
        if (errorEl) errorEl.textContent = msgs[e.code] || e.message;
      }
    };
  </script>
